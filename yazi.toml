# "$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[which]
sort_by      	 = "none"
sort_sensitive = false
sort_reverse 	 = false
sort_translit  = false

[opener]
# Keep a blocking editor available for Yazi's batch rename, even when Open is first.
edit = [
  { run = '${EDITOR:-hx} %s', block = true, desc = "Edit ($EDITOR)", for = "unix" },
  { run = 'hx %s', block = true, desc = "Edit (Helix)", for = "windows" },
]
open = [
  { run = 'xdg-open %s1', desc = "Open (system default)", for = "linux" },
  { run = 'open %s', desc = "Open (system default)", for = "macos" },
  { run = 'start "" %s1', orphan = true, desc = "Open (system default)", for = "windows" },
  { run = 'termux-open %s1', desc = "Open (system default)", for = "android" },
]
reveal = [
  { run = 'xdg-open %d1', desc = "Reveal", for = "linux" },
  { run = 'open -R %s1', desc = "Reveal", for = "macos" },
  { run = 'explorer /select,%s1', orphan = true, desc = "Reveal", for = "windows" },
  { run = 'termux-open %d1', desc = "Reveal", for = "android" },
  { run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
  { run = 'ya pub extract --list %s', desc = "Extract here" },
]
play = [
  { run = 'xdg-open %s1', desc = "Play", for = "linux" },
  { run = 'open %s', desc = "Play", for = "macos" },
  { run = 'start "" %s1', orphan = true, desc = "Play", for = "windows" },
  { run = 'termux-open %s1', desc = "Play", for = "android" },
  { run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
  { run = 'mediainfo %s1 & pause', block = true, desc = "Show media info", for = "windows" },
]
[confirm]
# trash
trash_title 	= "Trash {n} selected file{s}?"
trash_origin	= "center"
trash_offset	= [ 0, 0, 70, 20 ]

# delete
delete_title 	= "Permanently delete {n} selected file{s}?"
delete_origin	= "center"
delete_offset	= [ 0, 0, 70, 20 ]

# overwrite
overwrite_title  = "Overwrite file?"
overwrite_content   = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [ 0, 0, 50, 15 ]

# quit
quit_title  = "Quit?"
quit_content   = "The following tasks are still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [ 0, 0, 50, 15 ]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 7 ]

[open]
rules = [
  { mime = "application/pdf", use = [ "open", "reveal" ] },


	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# JSON
	{ mime = "application/{json,ndjson}", use = [ "open", "edit", "reveal" ] },
	{ mime = "*/javascript", use = [ "open", "edit", "reveal" ] },
	# Empty file
	{ mime = "inode/empty", use = [ "open", "edit", "reveal" ] },
  # { url = "*/", use = [ "edit", "open", "reveal", ] },
  { mime = "text/*", use = [
    "open",
    "edit",
    "reveal",
  ] },
  { mime = "image/*", use = [
    "open",
    "reveal",
  ] },
  { mime = "video/*", use = [
    "play",
    "reveal",
  ] },
  { mime = "audio/*", use = [
    "play",
    "reveal",
  ] },

  # PowerShell Scripts
  { mime = "text/x-powershell", use = [
    "open",
    "edit",
    "reveal",
  ] },
  { mime = "application/x-powershell", use = [
    "open",
    "edit",
    "reveal",
  ] },
  #
  # Batch Files
  { mime = "application/bat", use = [
    "open",
    "edit",
    "reveal",
  ] },
  { mime = "application/x-bat", use = [
    "open",
    "edit",
    "reveal",
  ] },
  { mime = "text/plain", url = "*.bat", use = [
    "open",
    "edit",
    "reveal",
  ] },

  # Text Files
  { mime = "text/plain", use = [
    "open",
    "edit",
    "reveal",
  ] },

  # .config Files
  { mime = "application/xml", url = "*.config", use = [
    "open",
    "edit",
    "reveal",
  ] },

  # Makefiles
  { mime = "text/x-makefile", use = [
    "open",
    "edit",
    "reveal",
  ] },
  { mime = "text/plain", url = "Makefile", use = [
    "open",
    "edit",
    "reveal",
  ] },

  # Dockerfiles
  { mime = "text/x-dockerfile", use = [
    "open",
    "edit",
    "reveal",
  ] },
  #
  # INI Files
  { mime = "text/plain", url = "*.ini", use = [
    "open",
    "edit",
    "reveal",
  ] },

  # .env Files
  { mime = "text/plain", url = "*.env", use = [
